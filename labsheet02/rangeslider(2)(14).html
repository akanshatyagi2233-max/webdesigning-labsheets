<!DOCTYPE html>
<html>
<head>
    <title>Range Slider</title>
    <link rel="stylesheet" href="rangeforrangeslider.css">
</head>

<body>

    <div class="box">
        <h2>Set Your Volume</h2>

        <label for="volume">Volume:</label>

        <input type="range" id="volume"
               min="0" max="100" value="50"
               oninput="volumeValue.value = this.value">

        <output id="volumeValue">50</output>%

        <br><br>

        <label for="age">Enter Number:</label>
        <input type="number" id="age" min="1" max="100" value="20">

    </div>

</body>
</html>
