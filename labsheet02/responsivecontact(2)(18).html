<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f2f5f9;
            padding: 40px 20px;
        }

        .contact-container {
            max-width: 1000px;
            margin: auto;
            background: white;
            display: flex;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
        }

        /* Contact Form */
        .contact-form {
            flex: 1;
            padding: 40px;
        }

        .contact-form h2 {
            color: #1d4ed8;
            margin-bottom: 10px;
        }

        .contact-form p {
            color: #666;
            margin-bottom: 25px;
        }

        .contact-form input,
        .contact-form textarea {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 6px;
            outline: none;
        }

        .contact-form input:focus,
        .contact-form textarea:focus {
            border-color: #1d4ed8;
        }

        .contact-form textarea {
            height: 120px;
            resize: none;
        }

        .contact-form button {
            background-color: #1d4ed8;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }

        .contact-form button:hover {
            background-color: #153eaa;
        }

        /* Company Details */
        .company-info {
            flex: 1;
            background-color: #1d4ed8;
            color: white;
            padding: 40px;
        }

        .company-info h2 {
            margin-bottom: 25px;
        }

        .info {
            margin-bottom: 25px;
        }

        .info h3 {
            margin-bottom: 8px;
        }

        .info p {
            line-height: 1.6;
        }

        /* Responsive Design */
        @media (max-width: 700px) {
            .contact-container {
                flex-direction: column;
            }

            .contact-form,
            .company-info {
                padding: 30px 25px;
            }
        }
    </style>
</head>

<body>

    <div class="contact-container">

        <!-- Contact Form -->
        <div class="contact-form">
            <h2>Contact Us</h2>
            <p>We would love to hear from you. Send us a message!</p>

            <form>
                <input type="text" placeholder="Your Name" required>

                <input type="email" placeholder="Your Email" required>

                <input type="text" placeholder="Subject" required>

                <textarea placeholder="Your Message" required></textarea>

                <button type="submit">Send Message</button>
            </form>
        </div>

        <!-- Company Location Details -->
        <div class="company-info">
            <h2>Company Information</h2>

            <div class="info">
                <h3>📍 Address</h3>
                <p>
                    COER University<br>
                    Roorkee, Uttarakhand<br>
                    India - 247667
                </p>
            </div>

            <div class="info">
                <h3>📞 Phone</h3>
                <p>+91 98765 43210</p>
            </div>

            <div class="info">
                <h3>✉ Email</h3>
                <p>contact@example.com</p>
            </div>

            <div class="info">
                <h3>🕒 Working Hours</h3>
                <p>Monday - Friday<br>9:00 AM - 5:00 PM</p>
            </div>
        </div>

    </div>

</body>
</html>
