<!DOCTYPE html>
<html>
<head>
    <title>Employee Evaluation</title>
    <link rel="stylesheet" href="employee.css">
</head>

<body>

    <div class="container">
        <h2>Employee Evaluation Form</h2>

        <div class="field">
            <label>Employee Name:</label>
            <input type="text">
        </div>

        <div class="field">
            <label>Employee ID:</label>
            <input type="text">
        </div>

        <div class="clear"></div>

        <div class="field">
            <label>Department:</label>
            <input type="text">
        </div>

        <div class="field">
            <label>Rating:</label>
            <select>
                <option>Excellent</option>
                <option>Good</option>
                <option>Average</option>
                <option>Poor</option>
            </select>
        </div>

        <div class="clear"></div>

        <label>Comments:</label>
        <textarea rows="5"></textarea>

        <button>Submit Evaluation</button>
    </div>

</body>
</html>
