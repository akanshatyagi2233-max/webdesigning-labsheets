<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Step Onboarding Form</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            background: #eef2f7;
        }

        .container {
            width: 420px;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        }

        h2 {
            text-align: center;
            color: #2563eb;
            margin-bottom: 25px;
        }

        /* All steps are hidden initially */
        .step {
            display: none;
        }

        /* Current step is displayed */
        .step.active {
            display: block;
        }

        label {
            display: block;
            margin: 12px 0 6px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #2563eb;
        }

        .buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 25px;
        }

        button {
            padding: 11px 20px;
            border: none;
            border-radius: 6px;
            background: #2563eb;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .back {
            background: #64748b;
        }

        .back:hover {
            background: #475569;
        }

        .progress {
            text-align: center;
            color: #666;
            margin-bottom: 20px;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>User Onboarding</h2>

    <div class="progress">
        <span id="stepNumber">Step 1 of 3</span>
    </div>

    <form>

        <!-- STEP 1 -->
        <div class="step active" id="step1">

            <h3>Personal Information</h3>

            <label for="name">Full Name</label>
            <input type="text" id="name" placeholder="Enter your name">

            <label for="email">Email</label>
            <input type="email" id="email" placeholder="Enter your email">

            <div class="buttons">
                <span></span>
                <button type="button" onclick="nextStep(2)">
                    Next
                </button>
            </div>

        </div>


        <!-- STEP 2 -->
        <div class="step" id="step2">

            <h3>Account Details</h3>

            <label for="username">Username</label>
            <input type="text" id="username"
                   placeholder="Choose a username">

            <label for="password">Password</label>
            <input type="password" id="password"
                   placeholder="Create a password">

            <div class="buttons">
                <button type="button"
                        class="back"
                        onclick="nextStep(1)">
                    Back
                </button>

                <button type="button"
                        onclick="nextStep(3)">
                    Next
                </button>
            </div>

        </div>


        <!-- STEP 3 -->
        <div class="step" id="step3">

            <h3>Preferences</h3>

            <label for="course">Select Course</label>

            <select id="course">
                <option value="">Choose Course</option>
                <option>BCA</option>
                <option>MCA</option>
                <option>B.Tech</option>
                <option>M.Tech</option>
            </select>

            <label>
                <input type="checkbox" style="width:auto;">
                Subscribe to newsletter
            </label>

            <div class="buttons">
                <button type="button"
                        class="back"
                        onclick="nextStep(2)">
                    Back
                </button>

                <button type="submit">
                    Finish
                </button>
            </div>

        </div>

    </form>

</div>


<script>
    function nextStep(step) {

        // Hide all steps
        document.querySelectorAll(".step").forEach(function(element) {
            element.classList.remove("active");
        });

        // Display selected step
        document.getElementById("step" + step)
                .classList.add("active");

        // Update progress text
        document.getElementById("stepNumber").innerText =
            "Step " + step + " of 3";
    }
</script>

</body>
</html>
