<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #f0f4f8;
            font-family: Arial, sans-serif;
        }

        .form-container {
            width: 400px;
            margin: 50px auto;
            padding: 30px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.15);
        }

        h2 {
            text-align: center;
            color: #1d4ed8;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;

            font-family: Georgia, serif;
            font-size: 15px;
            font-weight: bold;
            letter-spacing: 1px;
            text-transform: uppercase;
            line-height: 1.5;
            color: #333;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 14px;
            line-height: 1.5;
        }

        input::placeholder {
            font-family: Arial, sans-serif;
            letter-spacing: 1px;
            text-transform: capitalize;
            color: #888;
        }

        input:focus,
        select:focus {
            border-color: #1d4ed8;
            outline: none;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 12px;
            border: none;
            border-radius: 5px;
            background: #1d4ed8;
            color: white;
            font-size: 16px;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
        }

        button:hover {
            background: #153eaa;
        }
    </style>
</head>

<body>

    <div class="form-container">

        <h2>Registration</h2>

        <form>

            <label for="name">Full Name</label>
            <input type="text"
                   id="name"
                   placeholder="Enter your full name"
                   required>

            <label for="email">Email Address</label>
            <input type="email"
                   id="email"
                   placeholder="Enter your email"
                   required>

            <label for="phone">Phone Number</label>
            <input type="tel"
                   id="phone"
                   placeholder="Enter phone number"
                   required>

            <label for="course">Select Course</label>
            <select id="course">
                <option>BCA</option>
                <option>MCA</option>
                <option>B.Tech</option>
                <option>M.Tech</option>
            </select>

            <button type="submit">Register Now</button>

        </form>

    </div>

</body>
</html>
