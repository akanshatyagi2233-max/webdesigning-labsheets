<!DOCTYPE html>
<html>
<head>
   <title>Registration Form</title>
   <link rel="stylesheet" href="style.css">
   </head>
    <body>
        <form>
            <h1>Registration Form</h1>
            <label for="Name">Name:</label>
            <input type="text" id="Name" name="Name"  placeholder="Enter your Name">
            <br><br>

            
        <label for="Password">Password:</label>
          <input type="Password" id="Email" name="Password" placeholder="Enter Your Password">
       <br><br>
       <caption > Select Gender</caption>
          <input type="radio" name="Gender">Male
         <input type="radio" name="Gender">Female
         <br><br>

         <label>Hobbies</label>
         <input type="checkbox">Singing
         <input type="checkbox">Danceing
         <input type="checkbox">Reading

         <br><br>

         <caption>Select City</caption>
         <select name="City">
              <option value="Delhi">Delhi</option>
             <option value="Banglore">Banglore</option>
             <option value="Pune">Pune</option>
             <option value="Mumbai">Mumbai</option>
         <br><br>
         <br>
         </select>
    <br><br>
    <label>Message</label>
    <textarea Placeholder="Enter your message"></textarea>
    <br><br>
        
         <caption>Click Here to Submit</caption>
         <input type="submit" value="Submit">

        </form>

    </body>

</html>
