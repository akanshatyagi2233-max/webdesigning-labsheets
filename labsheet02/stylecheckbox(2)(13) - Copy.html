<!DOCTYPE html>
<html>
<head>
    <title>Styled Checkboxes and Radio Buttons</title>
    <link rel="stylesheet" href="checkbox.css">
</head>

<body>

    <div class="box">
        <h2>Choose Your Preferences</h2>

        <h3>Skills</h3>

        <label class="check">
            <input type="checkbox">
            <span></span>
            HTML
        </label>

        <label class="check">
            <input type="checkbox">
            <span></span>
            CSS
        </label>

        <label class="check">
            <input type="checkbox">
            <span></span>
            JavaScript
        </label>

        <h3>Gender</h3>

        <label class="radio">
            <input type="radio" name="gender">
            <span></span>
            Male
        </label>

        <label class="radio">
            <input type="radio" name="gender">
            <span></span>
            Female
        </label>

    </div>

</body>
</html>
